# lefthook.yml
output:
  - summary
  - success
  - failure

pre-commit:
  # sequential: lint fixes first, then format the result
  piped: true
  jobs:
    - name: oxlint
      glob: '*.{js,ts,jsx,tsx}'
      run: bunx oxlint --fix --deny-warnings {staged_files}
      stage_fixed: true
    - name: oxfmt
      glob: '*.{js,ts,jsx,tsx,json,yml,yaml,md}'
      run: bunx oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - name: format-check
      run: bun run format:check
    - name: lint-check
      run: bun run lint:check
